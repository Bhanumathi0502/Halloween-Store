<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Halloween Store - Join</title>
<style>
  html{
    background-image: url("bats.gif");
  }
* { 
  box-sizing: border-box; margin:0; padding:0; 
}
body { 
  font-family: Arial, sans-serif; background:#f7f7f7; color:#222;
 }

/* wrapper */
.wrapper {
  width:1620px;
  margin:28px auto;
  /* background:#fff; */
  box-shadow:0 6px 0 rgba(0,0,0,0.25);
  overflow:hidden;
}

/* HEADER - gradient right → left */
.header-area {
  display:flex;
  align-items:center;
  gap:16px;
  background: linear-gradient(to left,black, orange, white);
  padding:18px 22px;
}
.header-area img{
  width:70px;
  height:70px;
  border-radius:50%;
}
.header-area h1{
  font-size:30px;
  margin-bottom:4px;
  color:#222;
}
.header-area p{
  /* font-style:italic; */
  font-weight:bold;
  color:#222;
  font-size:14px;
}

/* NAVBAR */
.navbar { background:#000; padding:10px 22px; display:flex; gap:18px; }
.navbar a{ color:#fff; text-decoration:none; padding:6px 8px; border-radius:3px; transition:0.3s; }
.navbar a:hover{ background:#ff9933; color:#000; }
.navbar a:last-child{ color:orange; font-weight:700; }

/* CONTENT AREA */
.content-row { display:flex; gap:24px; padding:22px; background:#fff; }

/* SIDEBAR */
.sidebar {
  width:160px;
  padding:14px;
  align-self:flex-start;
}
.aside-item {
  background: #ffb84d;
  border: 2px solid #cc8400;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 4px;
  font-weight:700;
  text-align:center;
  cursor:pointer;
  color:#000;
  box-shadow: 0 2px 0 rgba(0,0,0,0.1);
}
.aside-item:hover {
  background: #ff9933;
  color:#fff;
}

/* MAIN CONTENT */
.main { flex:1; padding:6px 6px 18px 6px; }
.card { padding:18px 20px; border:1px solid #e5e5e5; background:#fff; box-shadow:0 2px 0 rgba(0,0,0,0.03); }
.card h2 { margin-bottom:12px; color:#222; }
label { display:block; margin-top:10px; font-weight:600; font-size:14px; color:#444; }
input[type="text"], input[type="email"] {
  width:320px; padding:8px 10px; margin-top:6px; border:1px solid #cfcfcf; border-radius:2px; font-size:14px;
}
.subscribe-row { margin-top:16px; }
input[type="submit"] {
  background:#ffb84d; border:2px solid #cc8400; padding:8px 18px; font-weight:700; cursor:pointer; border-radius:2px;
}
input[type="submit"]:hover { background:#ff9933; color:#fff; }

input:hover{
  border-color: blue;
}
/* FOOTER - gradient left → right */
.footer { 
  background: linear-gradient(to right,black, orange, white);
  text-align:center; 
  padding:12px 10px; 
  font-weight:700; 
  color:#222; 
  border-top:1px solid rgba(0,0,0,0.06); 
}

/* RESPONSIVE */
@media (max-width:980px){
  .wrapper { width:95%; }
  .content-row { flex-direction:column; }
  .sidebar { width:100%; display:flex; gap:8px; flex-wrap:wrap; }
  .aside-item { flex:1 1 48%; margin-bottom:10px; }
  .main input[type="text"], .main input[type="email"] { width:100%; }
}
</style>
</head>
<body>

<div class="wrapper">

  <header class="header-area">
    <img src="pumpkin.jpg" alt="pumpkin logo">
    <div>
      <h1>The Halloween Store </h1>
      <p>For the little Goblin in all of us!</p>
    </div>
  </header>

  <nav class="navbar">
    <a href="#">Home</a>
    <a href="#">Product List</a>
    <a href="#">Personal</a>
    <a href="#">Decorating Ideas</a>
    <a href="join_email.html">Join Email</a>
  </nav>

  <div class="content-row">
    <aside class="sidebar">
      <div class="aside-item">Props</div>
      <div class="aside-item">Costumes</div>
      <div class="aside-item">Special Effects</div>
      <div class="aside-item">Masks</div>
    </aside>

    <section class="main">
      <div class="card">
        <h2>Please enter the following information:</h2>
        <form action="thankyou.html" method="post">
          <label>First name:</label>
          <input type="text" name="fname" />
          <label>Last name:</label>
          <input type="text" name="lname" />
          <label>Email:</label>
          <input type="email" name="email" />
          <label>Zip code:</label>
          <input type="text" name="zip" />
          <div class="subscribe-row">
            <input type="submit" value="Subscribe" />
          </div>
        </form>
      </div>
    </section>
  </div>

  <footer class="footer">
    &copy; 2015 Ben Murach
  </footer>

</div>
</body>
</html>
